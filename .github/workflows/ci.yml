name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fiscvento
          POSTGRES_USER: fiscvento
          POSTGRES_PASSWORD: fiscvento
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          POSTGRES_HOST: localhost
          POSTGRES_DB: fiscvento
          POSTGRES_USER: fiscvento
          POSTGRES_PASSWORD: fiscvento
          POSTGRES_PORT: 5432

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build

  build-produccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imagen de backend (Gunicorn)
        run: docker build --target prod -t fiscvento-backend:prod ./backend
      - name: Imagen de frontend (Nginx)
        run: docker build --target prod -t fiscvento-frontend:prod ./frontend
