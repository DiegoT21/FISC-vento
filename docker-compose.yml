# Desarrollo local: Vite y runserver. Staging y producción usan
# docker-compose.prod.yml (Nginx + Gunicorn). El name coincide para que
# el volumen de Postgres sea el mismo si alguien levanta los dos.
name: fisc-vento

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fiscvento}
      POSTGRES_USER: ${POSTGRES_USER:-fiscvento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiscvento}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      target: dev
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data:
