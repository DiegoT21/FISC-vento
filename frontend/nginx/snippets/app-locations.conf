# Ubicaciones compartidas por el sitio en HTTP y, cuando haya certificado,
# por el server de HTTPS (ssl.conf incluye este mismo archivo).
resolver 127.0.0.11 ipv6=off valid=10s;

root /usr/share/nginx/html;
index index.html;
client_max_body_size 20m;
server_tokens off;

gzip on;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;
gzip_min_length 256;

location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

location /api/ {
    set $upstream_backend backend:8000;
    include /etc/nginx/proxy_params.conf;
    proxy_pass http://$upstream_backend;
}

location /admin {
    set $upstream_backend backend:8000;
    include /etc/nginx/proxy_params.conf;
    proxy_pass http://$upstream_backend;
}

location /static/ {
    alias /var/www/static/;
    access_log off;
    expires 7d;
}

location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 30d;
}

# sw.js cambia en cada build. Si el navegador se queda con una copia vieja,
# la PWA no ve la versión nueva. El manifiesto, igual: Chrome lo relee al
# instalar y al actualizar. 404 si faltan, para no devolver index.html.
location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# El HTML del shell tampoco puede quedar cacheado por el navegador: es el
# que apunta a los assets con hash. Las rutas de la SPA caen aquí por el
# redirect interno de try_files.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
