# Sustituye a app.conf cuando el certificado ya está emitido.
# docker-compose.https.yml lo monta sobre default.conf. El reto de
# Let's Encrypt sigue por el puerto 80; el resto redirige a HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
